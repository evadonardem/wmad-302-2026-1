services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-capstone-dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8081:8081"   # Metro bundler
      - "8082:8082"   # Metro websocket
      - "8083:8083"   # Expo dev tools
      - "19000:19000" # Expo dev server
      - "19001:19001" # Expo dev server (alt)
      - "19002:19002" # Expo dev server (alt)
      - "19006:8081"  # Expo web compatibility URL; Metro serves web on 8081
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      # Use this computer's LAN IP so both its browser and Expo Go can connect.
      # Update this if the computer's Wi-Fi address changes.
      - REACT_NATIVE_PACKAGER_HOSTNAME=192.168.1.12
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
    # --web serves the app in the browser too (http://localhost:8081)
    command: npx expo start --host lan --web --clear

  # Optional: Add a separate service for running tests
  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace-capstone-test
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app
    command: npm test -- --watchAll=false
    profiles:
      - test

networks:
  default:
    name: marketplace-capstone-network