services:
  app:
    build: .
    user: "root"
    ports:
      - "8001:5173"
    volumes:
      - .:/app
      - /app/node_modules        
      - /app/.vite              
    shm_size: '2gb'              
    stdin_open: true
    tty: true
    command: sh -c "npm install && npm run dev -- --host"


