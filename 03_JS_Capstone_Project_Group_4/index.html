<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>e-Barangay Disaster & Ayuda Portal</title>
    <link rel="stylesheet" href="./src/style.css" />
    
    <style>
      .stats-grid { 
        display: grid; 
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); 
        gap: 1rem; 
        margin-bottom: 1.5rem; 
      }
      .stat-card { 
        background: #fff; 
        padding: 1rem; 
        border-radius: 8px; 
        border: 1px solid #e2e8f0; 
        text-align: center; 
      }
      .stat-card p.label { 
        font-size: 0.85rem; 
        color: #64748b; 
        margin-bottom: 0.25rem; 
        font-weight: 600; 
      }
      .stat-card p.value { 
        font-size: 1.75rem; 
        font-weight: 700; 
        margin: 0; 
      }
      .stat-critical { color: #dc2626; }
      .stat-high { color: #d97706; }
      .stat-low { color: #059669; }
      
      .filter-controls { 
        display: flex; 
        gap: 0.75rem; 
        margin-bottom: 1.5rem; 
        flex-wrap: wrap; 
      }
      .filter-controls input, .filter-controls select { 
        padding: 0.5rem; 
        border: 1px solid #cbd5e1; 
        border-radius: 6px; 
      }
      .filter-controls input { flex: 1; min-width: 200px; }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="header">
        <h1>e-Barangay Portal</h1>
        <p>Disaster Emergency & Ayuda Management System</p>
      </header>

      <main class="container">
        <!-- 1. DASHBOARD MONITORING & FILTERS (PINAKA-ITAAS) -->
        <section class="card">
          <h2>Dashboard Overview</h2>

          <!-- Summary Stats -->
          <div class="stats-grid">
            <div class="stat-card">
              <p class="label">Total Registered</p>
              <p id="stat-total" class="value">0</p>
            </div>
            <div class="stat-card">
              <p class="label stat-critical">Critical</p>
              <p id="stat-critical" class="value stat-critical">0</p>
            </div>
            <div class="stat-card">
              <p class="label stat-high">High / Medium</p>
              <p id="stat-high" class="value stat-high">0</p>
            </div>
            <div class="stat-card">
              <p class="label stat-low">Low</p>
              <p id="stat-low" class="value stat-low">0</p>
            </div>
          </div>

          <!-- Search & Filter Controls -->
          <div class="filter-controls">
            <input type="text" id="search-input" placeholder="Search resident by name..." />
            <select id="filter-priority">
              <option value="ALL">All Priorities</option>
              <option value="CRITICAL">Critical</option>
              <option value="HIGH">High</option>
              <option value="MEDIUM">Medium</option>
              <option value="LOW">Low</option>
            </select>
          </div>
        </section>

        <!-- 2. AYUDA APPLICATION FORM -->
        <section class="card">
          <h2>Resident Registration</h2>
          <form id="ayuda-form">
            <div class="form-group">
              <label for="name">Full Name</label>
              <input type="text" id="name" required placeholder="Juan Dela Cruz" />
            </div>

            <div class="form-group">
              <label for="prov-select">Province</label>
              <select id="prov-select" required>
                <option value="">Select Province...</option>
              </select>
            </div>

            <div class="form-group">
              <label for="city-select">City / Municipality</label>
              <select id="city-select" required>
                <option value="">Select City/Municipality...</option>
              </select>
            </div>

            <div class="form-group">
              <label for="monthly-income">Monthly Income (₱)</label>
              <input type="number" id="monthly-income" required placeholder="9500" />
            </div>

            <div class="form-group checkbox-group">
              <label><input type="checkbox" id="is-senior" /> Senior Citizen</label>
              <label><input type="checkbox" id="is-pwd" /> Person with Disability (PWD)</label>
            </div>

            <div class="form-group">
              <label for="dependent-count">Number of Dependents</label>
              <input type="number" id="dependent-count" value="0" min="0" />
            </div>

            <button type="submit" class="btn primary">Evaluate & Register</button>
          </form>
        </section>

        <!-- 3. RELIEF PACKER POS REGISTER -->
        <section class="card">
          <h2>Relief Package POS Register</h2>
          <div id="pos-container">
            <!-- Render POS register and progress bar here -->
          </div>
          <div class="pos-controls" style="margin-top: 1rem; display: flex; gap: 0.5rem;">
            <input type="text" id="item-name" placeholder="Item Name (e.g., Rice 5kg)" style="flex: 2;" />
            <input type="number" id="item-price" placeholder="Price (₱)" style="flex: 1;" />
            <button type="button" id="add-item-btn" class="btn primary" style="width: auto;">Add Item</button>
          </div>
        </section>

        <!-- 4. LIVE REGISTERED QUEUE CARDS -->
        <section class="card">
          <h2>Registered Queue</h2>
          <!-- Support for both container ID formats used in main.js -->
          <div id="resident-list-container">
            <div id="registered-queue">
              <!-- Render resident cards here -->
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
